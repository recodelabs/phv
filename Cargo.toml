[package]
name = "phv"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Personal health vault: FHIR records as files on your own machine, versioned with Git"
repository = "https://github.com/recodelabs/phv"
license = "MIT"

[lib]
name = "phv"
path = "src/lib.rs"

[[bin]]
name = "phv"
path = "src/main.rs"

[dependencies]
askama = "0.16"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
humantime = "2"
octofhir-fhirpath = { version = "=0.5.8", default-features = false }
octofhir-fhirschema = { version = "=0.3.37", default-features = false }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
